name: Build
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - int

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/wrapper-validation-action@v3
      - uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: release-candidate
      - run: ./gradlew check
