[versions]
junit = "6.0.3"

[plugins]
gradle-publish = "com.gradle.plugin-publish:2.1.0"

[libraries]
junit-api = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-platform = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
plugin-android = "com.android.tools.build:gradle:9.1.1"
plugin-kotlin = "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20"

[bundles]
junit = ['junit-api', 'junit-params']
plugins-convention-project = ['plugin-android', 'plugin-kotlin']
